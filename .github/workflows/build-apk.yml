name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create audio asset placeholder
        run: |
          mkdir -p assets/audio
          curl -L --silent --max-time 30 \
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" \
            -o assets/audio/andean_music.mp3 || \
          touch assets/audio/andean_music.mp3
          ls -lh assets/audio/

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/AjedrezInka.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AjedrezInka-APK
          path: build/app/outputs/flutter-apk/AjedrezInka.apk
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes 2>/dev/null || true
          gh release create v1.0.0 \
            build/app/outputs/flutter-apk/AjedrezInka.apk \
            --title "🏔️ Ajedrez Inka v1.0.0" \
            --notes "El juego de estrategia modular inspirado en el Tahuantinsuyo." \
            --latest
